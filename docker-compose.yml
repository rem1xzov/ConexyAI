services:
  postgres:
    image: postgres:16-alpine
    container_name: conexy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ConexyAI
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - conexy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ConexyAI"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conexy_pgdata:
