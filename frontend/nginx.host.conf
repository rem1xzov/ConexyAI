# ХОСТОВЫЙ nginx сервера conexyai.ru (НЕ контейнерный).
#
# Отличие от frontend/nginx.conf: TLS терминируется ЗДЕСЬ (Let's Encrypt + ACME-редирект),
# а не в Cloudflare, поэтому серверов два — 80 (редирект) и 443 (основной).
# Файл лежит в репозитории, чтобы правки на сервере больше не расходились с origin и
# `git pull` проходил чисто. На сервере он подключается (или копируется) в
#   /etc/nginx/sites-available/conexyai.conf  (симлинк в sites-enabled).
#
# STATIC_CACHE: index.html отдаётся с `no-cache`, иначе браузер/ярлык-PWA продолжает
# открывать СТАРЫЙ index.html, который ссылается на старый JS-бандл с хешем в имени —
# именно так на телефоне оставалась старая версия фронтенда при новой сборке на сервере.
# Ассеты в /assets/ имеют хеш содержимого в имени, поэтому их можно кешировать навсегда.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

log_format conexy_redacted '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent" rt=$request_time';

# HTTP -> HTTPS redirect (кроме ACME-проверок для продления сертификата)
server {
    listen 80;
    server_name conexyai.ru www.conexyai.ru;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name conexyai.ru www.conexyai.ru;

    ssl_certificate     /etc/letsencrypt/live/conexyai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conexyai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log conexy_redacted;

    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback + STATIC_CACHE (см. комментарий в шапке файла).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Ассеты Vite: хеш содержимого в имени — кешируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        set $backend_api "http://backend:8080";
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /hubs/ {
        set $backend_hub "http://backend:8080";
        proxy_pass $backend_hub$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
