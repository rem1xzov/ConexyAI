<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>ConexyAI</title>
    <!-- FAVICON: the brand mark itself (dark tile, white chevrons), served straight from public/.
         SVG is what every current browser wants for a tab icon: one file, crisp at any size. The
         old browsers that cannot read it fall back to their own default icon — a raster fallback
         would need a real PNG/ICO, which is not generated here. -->
    <link rel="icon" type="image/svg+xml" href="/conexyai.svg" />
  </head>

    <div id="root"></div>
