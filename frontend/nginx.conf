# TLS is terminated by Cloudflare; the origin only serves plain HTTP on port 80.
# To force HTTPS for visitors, enable "Always Use HTTPS" in Cloudflare
# (SSL/TLS -> Edge Certificates) — do NOT redirect HTTP->HTTPS at the origin.

# WS_UPGRADE_FIX: добавлено 2026-09-22
# Раньше для /hubs/ жёстко выставлялось `Connection: upgrade`. Но по этому маршруту идут и
# обычные запросы: negotiate (POST без Upgrade) и long-polling/SSE fallback. С зашитым
# "upgrade" они уезжали на бэкенд с бессмысленным заголовком, nginx мог переиспользовать такое
# upstream-соединение и отдавать периодические 502 — ровно то, что видно в Network на negotiate.
# Канонический идиом из документации nginx: отправлять upgrade только когда клиент его просит.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name conexyai.ru www.conexyai.ru;

    # ATTACHMENT_SIZE_LIMIT: добавлено 2026-09-22 — дефолт nginx = 1MB, из-за чего одно фото
    # проходило, а два уже падали с 413 ДО того, как запрос доходил до Kestrel. Лимит поднят
    # с запасом над [RequestSizeLimit(55MB)] на контроллере и MaxRequestBodySize (60MB) в Kestrel.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SignalR hub (long-lived WebSocket + SSE).
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SIGNALR_TIMEOUTS: 120s было меньше, чем длительность одного шага агента (bash-команда
        # в песочнице может идти до 300s), и прокси рвал соединение на ровном месте. Час с запасом;
        # линию поддерживает keep-alive SignalR (15s), так что idle-таймаут всё равно не срабатывает.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE/long-polling fallback must not be held in a proxy buffer.
        proxy_buffering off;
    }
}
