# TLS is terminated by Cloudflare; the origin only serves plain HTTP on port 80.
# To force HTTPS for visitors, enable "Always Use HTTPS" in Cloudflare
# (SSL/TLS -> Edge Certificates) — do NOT redirect HTTP->HTTPS at the origin.
server {
    listen 80;
    server_name conexyai.ru www.conexyai.ru;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SignalR hub (long-lived WebSocket + SSE).
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
