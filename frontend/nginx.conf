# TLS is terminated by Cloudflare; the origin only serves plain HTTP on port 80.
# To force HTTPS for visitors, enable "Always Use HTTPS" in Cloudflare
# (SSL/TLS -> Edge Certificates) — do NOT redirect HTTP->HTTPS at the origin.

# WS_UPGRADE_FIX: добавлено 2026-09-22
# Раньше для /hubs/ жёстко выставлялось `Connection: upgrade`. Но по этому маршруту идут и
# обычные запросы: negotiate (POST без Upgrade) и long-polling/SSE fallback. С зашитым
# "upgrade" они уезжали на бэкенд с бессмысленным заголовком, nginx мог переиспользовать такое
# upstream-соединение и отдавать периодические 502 — ровно то, что видно в Network на negotiate.
# Канонический идиом из документации nginx: отправлять upgrade только когда клиент его просит.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# BACKEND_DNS_FIX: добавлено 2026-09-23
# ПРИЧИНА ПОВТОРЯЮЩИХСЯ 502 И ЗАВИСШЕГО «ПЕРЕПОДКЛЮЧЕНИЯ».
# `proxy_pass http://backend:8080` резолвится ОДИН РАЗ при загрузке конфига: nginx запоминает IP
# контейнера бэкенда и держит его до перезагрузки. Как только бэкенд пересоздаётся (любой деплой:
# docker compose up -d --build), у него НОВЫЙ IP, а nginx продолжает стучаться по старому — и
# отдаёт 502 на всё: и на negotiate SignalR, и на GET /api/conexy/{id}.
# Отсюда оба симптома сразу: клиент вечно «переподключается», а сторож завершения (он ходит именно
# в /api/conexy/{id}) не может прочитать статус задачи, поэтому генерация «висит» до ручного «Стоп».
# Резолвер + переменная в proxy_pass заставляют резолвить имя на каждом запросе через встроенный
# DNS Docker (127.0.0.11) с кэшем 10 секунд, поэтому смена IP подхватывается сама.
resolver 127.0.0.11 valid=10s ipv6=off;

# REAL_CLIENT_IP: добавлено 2026-09-24 (ревью M20)
# Перед nginx стоит Cloudflare, поэтому $remote_addr — это IP узла Cloudflare, а не посетителя.
# Бэкенд режет частоту логина/регистрации по IP клиента (берёт его из X-Forwarded-For, который
# формирует nginx), и без этого блока все посетители одного узла Cloudflare делили бы общий лимит.
# Заголовку CF-Connecting-IP верим ТОЛЬКО если соединение пришло с адреса Cloudflare — иначе кто
# угодно, стучащийся в origin напрямую, подделал бы свой IP. Диапазоны: https://www.cloudflare.com/ips/
# (меняются редко; при обновлении списка у Cloudflare обновить и здесь).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ACCESS_LOG_REDACTION: добавлено 2026-09-24 (ревью L12)
# SignalR из браузера передаёт JWT в query string (/hubs/conexy?access_token=...), а стандартный
# формат "main" пишет $request — строку запроса ЦЕЛИКОМ, вместе с токеном. Этот формат пишет $uri
# (путь без query string), поэтому ни токены, ни OAuth-коды (?code=&state=) в access-лог не попадают.
log_format conexy_redacted '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent" rt=$request_time';

server {
    listen 80;
    server_name conexyai.ru www.conexyai.ru;

    # ACCESS_LOG_REDACTION: переопределяет унаследованный "main" для всех location этого сервера.
    access_log /var/log/nginx/access.log conexy_redacted;

    # ATTACHMENT_SIZE_LIMIT: добавлено 2026-09-22 — дефолт nginx = 1MB, из-за чего одно фото
    # проходило, а два уже падали с 413 ДО того, как запрос доходил до Kestrel. Лимит поднят
    # с запасом над [RequestSizeLimit(55MB)] на контроллере и MaxRequestBodySize (60MB) в Kestrel.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API.
    location /api/ {
        # BACKEND_DNS_FIX: переменная вместо литерала — имя резолвится на каждом запросе (см. resolver выше).
        set $backend_api "http://backend:8080";
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SignalR hub (long-lived WebSocket + SSE).
    location /hubs/ {
        # BACKEND_DNS_FIX: то же самое — иначе после пересоздания бэкенда долгоживущий WS некуда
        # переподключить и negotiate отвечает 502 до ручного рестарта nginx.
        set $backend_hub "http://backend:8080";
        proxy_pass $backend_hub$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SIGNALR_TIMEOUTS: 120s было меньше, чем длительность одного шага агента (bash-команда
        # в песочнице может идти до 300s), и прокси рвал соединение на ровном месте. Час с запасом;
        # линию поддерживает keep-alive SignalR (15s), так что idle-таймаут всё равно не срабатывает.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE/long-polling fallback must not be held in a proxy buffer.
        proxy_buffering off;
    }
}
