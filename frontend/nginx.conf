server {
    listen 80;
    server_name conexyai.ru www.conexyai.ru;

    # HTTP -> HTTPS redirect that never loops behind Cloudflare.
    #
    # Cloudflare sets X-Forwarded-Proto to the visitor's original scheme, so a visitor that
    # is already on HTTPS reaches us with "https" and is served directly (no redirect). Real
    # HTTP visitors (and direct origin hits with no header) get a 301 to https://.
    #
    # This assumes Cloudflare "Flexible" (Cloudflare terminates TLS and proxies to the origin
    # over HTTP on port 80). For Cloudflare "Full"/"Full (Strict)", add a `listen 443 ssl`
    # server block with a certificate — see DEPLOY.md.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SignalR hub (long-lived WebSocket + SSE).
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
